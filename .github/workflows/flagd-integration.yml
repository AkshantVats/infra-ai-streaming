name: flagd-integration

on:
  push:
    branches: [main, "feat/flagd-*"]
    paths:
      - "distributed-flagd/**"
  pull_request:
    branches: [main]
    paths:
      - "distributed-flagd/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: distributed-flagd/go.mod
          cache-dependency-path: distributed-flagd/go.sum

      - name: gofmt (check)
        run: |
          cd distributed-flagd
          test -z "$(gofmt -l .)"

      - name: go vet
        run: cd distributed-flagd && go vet ./...

      - name: go test (unit + SDK)
        run: cd distributed-flagd && go test ./...

  integration:
    runs-on: ubuntu-latest

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.0
        ports:
          - 2379:2379
        options: >-
          --entrypoint /usr/local/bin/etcd
          --health-cmd "/usr/local/bin/etcdctl --endpoints=http://localhost:2379 endpoint health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: distributed-flagd/go.mod
          cache-dependency-path: distributed-flagd/go.sum

      - name: go test (integration)
        env:
          FLAGD_INTEGRATION: "1"
          FLAGD_TEST_ETCD: "localhost:2379"
          ETCD_ENDPOINTS: "http://localhost:2379"
        run: cd distributed-flagd && go test -v -timeout 120s ./tests/integration/... ./internal/etcdstore/...

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: infra_ai
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 15s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 3s

      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.0
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
        options: >-
          --entrypoint /usr/local/bin/etcd
          --health-cmd "/usr/local/bin/etcdctl --endpoints=http://localhost:2379 endpoint health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - uses: actions/checkout@v4

      # Redpanda requires --mode dev-container and custom kafka-addr flags that
      # GitHub Actions service containers cannot pass. Start it as a docker run step.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v24.2.4 \
            redpanda start \
              --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092 \
              --advertise-kafka-addr internal://redpanda:29092,external://127.0.0.1:9092 \
              --rpc-addr 0.0.0.0:33145 \
              --advertise-rpc-addr 127.0.0.1:33145 \
              --smp 1 \
              --memory 1024M \
              --reserve-memory 0M \
              --overprovisioned \
              --check=false \
              --mode dev-container \
              --default-log-level=warn \
              --set redpanda.auto_create_topics_enabled=true

          # Wait for Redpanda health
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health --brokers localhost:9092 2>/dev/null && break
            echo "Waiting for Redpanda... attempt $i"
            sleep 3
          done

          # Create required topics
          docker exec redpanda rpk topic create inference-events --brokers localhost:29092 --partitions 4 --replicas 1 || true
          docker exec redpanda rpk topic create inference-dlq    --brokers localhost:29092 --partitions 1 --replicas 1 || true
          docker exec redpanda rpk topic create anomaly-events   --brokers localhost:29092 --partitions 2 --replicas 1 || true
          echo "Redpanda ready."

      - name: Apply ClickHouse schema
        run: |
          # Wait for ClickHouse to be ready
          for i in $(seq 1 20); do
            docker exec "$(docker ps -qf 'ancestor=clickhouse/clickhouse-server:24.3-alpine')" \
              clickhouse-client --query 'SELECT 1' 2>/dev/null && break
            echo "Waiting for ClickHouse... $i"
            sleep 3
          done
          CH=$(docker ps -qf 'ancestor=clickhouse/clickhouse-server:24.3-alpine')
          for f in deploy/clickhouse/*.sql; do
            docker exec -i "$CH" clickhouse-client --database infra_ai --multiquery < "$f" || true
          done

      - name: Verify Redpanda still running
        run: |
          if ! docker ps --filter name=redpanda --filter status=running -q | grep -q .; then
            echo "::error::Redpanda container is not running! Logs:"
            docker logs redpanda 2>&1 | tail -30
            exit 1
          fi
          echo "Redpanda running: $(docker ps --filter name=redpanda --format '{{.Status}}')"

      - uses: actions/setup-go@v7
        with:
          go-version-file: consumer/go.mod
          cache-dependency-path: consumer/go.sum

      - name: consumer — integration tests (Kafka + Redis + ClickHouse)
        env:
          KAFKA_BROKERS: "127.0.0.1:9092"
          REDIS_ADDR: "127.0.0.1:6379"
          CLICKHOUSE_DSN: "clickhouse://default:@127.0.0.1:9000/infra_ai"
        run: |
          cd consumer
          go test -tags integration ./... -count=1 -timeout 120s \
            -coverprofile=/tmp/consumer-integration.out -covermode=atomic
          go tool cover -func=/tmp/consumer-integration.out | tail -3

      - name: tool-call-analyzer — unit + integration tests
        env:
          KAFKA_BROKERS: "127.0.0.1:9092"
        run: |
          cd tool-call-analyzer
          go test ./... -count=1 -timeout 60s -short \
            -coverprofile=/tmp/tca.out -covermode=atomic
          go tool cover -func=/tmp/tca.out | tail -3

      - name: distributed-flagd — integration tests (etcd)
        env:
          ETCD_ENDPOINTS: "http://127.0.0.1:2379"
        run: |
          cd distributed-flagd
          go test -tags integration ./... -count=1 -timeout 120s \
            -coverprofile=/tmp/flagd-integration.out -covermode=atomic
          go tool cover -func=/tmp/flagd-integration.out | tail -3

      - name: traceforge — all tests
        run: |
          cd traceforge
          go test ./... -count=1 -timeout 60s \
            -coverprofile=/tmp/traceforge.out -covermode=atomic
          go tool cover -func=/tmp/traceforge.out | tail -3

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: /tmp/*.out
          retention-days: 7

  coverage-gate:
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    steps:
      - name: Check integration job passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "Integration tests passed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceforge"
version = "0.1.0"
description = "Python SDK — emit agent spans to the TraceForge collector"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["traceforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
